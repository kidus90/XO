name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HTML_FILE: Study_Quest_2_.html   # your single-file app
  APP_NAME: Study Quest
  APP_ID: com.kidus.studyquest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp "$HTML_FILE" www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Optional: publish the APK as a GitHub Release on version tags
      # - name: Release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: android/app/build/outputs/apk/debug/app-debug.apk
